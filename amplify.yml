version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - env | grep -e GOOGLE_CLIENT_ID >> .env.production
        - env | grep -e GOOGLE_CLIENT_SECRET >> .env.production
        - env | grep -e DATABASE_URL >> .env.production
        - env | grep -e IMAGE_UPLOAD_URL >> .env.production
        - env | grep -e RUNPOD_API_KEY >> .env.production
        - env | grep -e INPUT_DIR >> .env.production
        - env | grep -e OUTPUT_DIR >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*